version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tinyurl_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tinyurl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tinyurl"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mynet

  redis:
    image: redis:7-alpine
    container_name: tinyurl_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - mynet 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinyurl_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tinyurl
      - REDIS_URL=redis://redis:6379
      - BASE_DOMAIN=http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mynet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tinyurl_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_DOMAIN=http://localhost:3000
      - BACKEND_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mynet

volumes:
  pgdata:
  redisdata:

networks:
  mynet:
    driver: bridge